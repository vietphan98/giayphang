[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giayphang"
version = "0.1.0"
description = "Biến ảnh chụp giấy tờ nghiêng, tối thành bản scan phẳng, sạch, xuất PDF – chạy offline, miễn phí."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Viet Phan" }]
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.8", "numpy>=1.24", "Pillow>=10.0"]

[project.scripts]
giayphang = "giayphang.cli:main"

[tool.setuptools]
packages = ["giayphang"]

[tool.setuptools.package-data]
giayphang = ["fonts/*"]
